<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FoodMe</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body,
      button,
      input,
      textarea,
      select {
        font-family: "Cambria", "Times New Roman", serif;
      }
      body {
        background: #0b0c10;
      }
      .navbar-brand {
        font-weight: 800;
        letter-spacing: 1px;
        font-size: 1.4rem;
        text-transform: uppercase;
      }
      .brand-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        padding: 0.25rem 0.9rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #ff4b2b, #ffcc33);
        color: #111;
      }
      .brand-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #111;
      }
      .restaurant-card {
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
        border: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .restaurant-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 22px 55px rgba(0, 0, 0, 0.24);
      }
      .btn-primary {
        background: linear-gradient(135deg, #ff4b2b, #ff416c);
        border: none;
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #e53b1c, #e63662);
      }
    </style>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">
          <span class="brand-pill">
            Food<span style="color:#111;">Me</span>
            <span class="brand-dot"></span>
          </span>
        </a>
        <div class="d-flex gap-2 align-items-center">
          <a href="{{ url_for('profile') }}" class="btn btn-outline-light btn-sm">
            Profile
          </a>
          <a href="{{ url_for('view_cart') }}" class="btn btn-outline-light btn-sm position-relative">
            Cart
            <span class="badge bg-danger ms-1">{{ cart_count }}</span>
          </a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="mb-3">
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  </html>
