{% extends "base.html" %}

{% block content %}
  <div class="row g-4">
    <div class="col-lg-6">
      <div class="card h-100">
        <div class="card-body">
          <h4 class="card-title mb-3">Profile</h4>
          <form method="post">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" name="name" class="form-control" value="{{ profile.name or '' }}" />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" value="{{ profile.email or '' }}" />
            </div>
            <div class="mb-3">
              <label class="form-label">Mobile Number</label>
              <input type="text" name="phone" class="form-control" value="{{ profile.phone or '' }}" />
            </div>
            <button type="submit" class="btn btn-primary">Save Profile</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="card mb-4">
        <div class="card-body">
          <h4 class="card-title mb-3">Addresses</h4>
          {% if profile.addresses %}
            <div class="list-group mb-3">
              {% for address in profile.addresses %}
                <div class="list-group-item d-flex justify-content-between align-items-start">
                  <div>
                    {% if address.label %}
                      <div class="fw-semibold">{{ address.label }}</div>
                    {% endif %}
                    <div class="text-muted small">{{ address.address_line }}</div>
                  </div>
                  <form
                    method="post"
                    action="{{ url_for('delete_address', address_id=address.id) }}"
                    onsubmit="return confirm('Remove this address?');"
                  >
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                  </form>
                </div>
              {% endfor %}
            </div>
          {% else %}
            <p class="text-muted">No addresses saved yet.</p>
          {% endif %}

          <form method="post" action="{{ url_for('add_address') }}">
            <div class="mb-2">
              <label class="form-label">Label (optional)</label>
              <input type="text" name="label" class="form-control" placeholder="Home, Office, etc." />
            </div>
            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea name="address_line" rows="2" class="form-control" required></textarea>
            </div>
            <button type="submit" class="btn btn-outline-primary w-100">Add Address</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
